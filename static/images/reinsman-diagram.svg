<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#6B7280" />
    </marker>
  </defs>

  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <!-- Outer Frame -->
    <rect x="30" y="30" width="940" height="640" rx="16" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="8 8" opacity="0.8" />
    <text x="50" y="55" fill="#6B7280" font-size="14" font-weight="600" dominant-baseline="middle">AX — 기존 조직 (AI Transformation)</text>

    <!-- Top Left Production Text -->
    <text x="250" y="80" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" dominant-baseline="middle">Production ↑</text>
    <text x="250" y="105" font-size="12" fill="#6B7280" text-anchor="middle" dominant-baseline="middle">Production = Agent × Reinsman</text>

    <!-- Vertical Connection Arrow -->
    <line x1="250" y1="380" x2="250" y2="318" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />

    <!-- Harness Group -->
    <rect x="80" y="380" width="340" height="180" rx="24" fill="#F97316" fill-opacity="0.12" stroke="#F97316" stroke-width="2" />
    <text x="250" y="410" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" dominant-baseline="middle">Harness</text>
    <text x="250" y="430" font-size="12" fill="#6B7280" text-anchor="middle" dominant-baseline="middle">AGENTS.md · tools · rules</text>

    <!-- Model Group -->
    <rect x="120" y="440" width="260" height="90" rx="12" fill="#9CA3AF" />
    <text x="250" y="475" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" dominant-baseline="middle">Model</text>
    <text x="250" y="500" font-size="12" fill="#374151" text-anchor="middle" dominant-baseline="middle">Anthropic · OpenAI</text>

    <!-- Agent Group -->
    <rect x="80" y="220" width="340" height="90" rx="16" fill="#FFFFFF" stroke="#111827" stroke-width="2" />
    <text x="250" y="255" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle" dominant-baseline="middle">Agent</text>
    <text x="250" y="285" font-size="14" fill="#6B7280" text-anchor="middle" dominant-baseline="middle">Model + Harness</text>
    <text x="250" y="340" font-size="12" fill="#6B7280" text-anchor="middle" dominant-baseline="middle">— Hashimoto, 26.1Q</text>

    <!-- Connecting Badge Lines (Behind Reinsman) -->
    <line x1="885" y1="95" x2="780" y2="247" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5" />
    <line x1="925" y1="195" x2="780" y2="247" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5" />
    <line x1="925" y1="305" x2="780" y2="247" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5" />
    <line x1="805" y1="425" x2="780" y2="247" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5" />

    <!-- Reins -->
    <path d="M 420 265 Q 560 320 700 260" fill="none" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round" />

    <!-- Reinsman Figure -->
    <polygon points="760,205 800,205 820,290 740,290" fill="#2563EB" fill-opacity="0.15" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" />
    <line x1="760" y1="230" x2="700" y2="260" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
    <line x1="800" y1="230" x2="720" y2="250" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="780" cy="180" r="25" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />

    <text x="780" y="340" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle" dominant-baseline="middle">Reinsman (마부)</text>
    <text x="780" y="365" font-size="14" fill="#6B7280" text-anchor="middle" dominant-baseline="middle">— 고삐를 쥔 사람</text>

    <!-- Callout Badges -->
    <!-- I -->
    <rect x="820" y="80" width="130" height="30" rx="8" fill="#2563EB" fill-opacity="0.08" stroke="#1D4ED8" stroke-width="1" />
    <text x="885" y="95" font-size="13" font-weight="500" fill="#111827" text-anchor="middle" dominant-baseline="middle">Ⅰ. 맥락 중간 결재</text>
    
    <!-- II -->
    <rect x="870" y="180" width="110" height="30" rx="8" fill="#2563EB" fill-opacity="0.08" stroke="#1D4ED8" stroke-width="1" />
    <text x="925" y="195" font-size="13" font-weight="500" fill="#111827" text-anchor="middle" dominant-baseline="middle">Ⅱ. 전결권 조율</text>
    
    <!-- III -->
    <rect x="860" y="290" width="130" height="30" rx="8" fill="#2563EB" fill-opacity="0.08" stroke="#1D4ED8" stroke-width="1" />
    <text x="925" y="305" font-size="13" font-weight="500" fill="#111827" text-anchor="middle" dominant-baseline="middle">Ⅲ. Y/N 승인 · 모니터링</text>
    
    <!-- IV -->
    <rect x="740" y="410" width="130" height="30" rx="8" fill="#2563EB" fill-opacity="0.08" stroke="#1D4ED8" stroke-width="1" />
    <text x="805" y="425" font-size="13" font-weight="500" fill="#111827" text-anchor="middle" dominant-baseline="middle">Ⅳ. 조직 관성 연착륙</text>

    <!-- Bottom Legend -->
    <!-- Model Swatch -->
    <rect x="290" y="630" width="16" height="16" rx="4" fill="#9CA3AF" />
    <text x="314" y="638" font-size="13" font-weight="500" fill="#111827" dominant-baseline="middle">Model (LLM)</text>
    
    <!-- Harness Swatch -->
    <rect x="425" y="630" width="16" height="16" rx="4" fill="#F97316" fill-opacity="0.12" stroke="#F97316" stroke-width="2" />
    <text x="449" y="638" font-size="13" font-weight="500" fill="#111827" dominant-baseline="middle">Harness (엔지니어링)</text>
    
    <!-- Reinsman Swatch -->
    <rect x="590" y="630" width="16" height="16" rx="4" fill="#2563EB" fill-opacity="0.15" stroke="#2563EB" stroke-width="2" />
    <text x="614" y="638" font-size="13" font-weight="500" fill="#111827" dominant-baseline="middle">Reinsman (리더십)</text>
  </g>
</svg>