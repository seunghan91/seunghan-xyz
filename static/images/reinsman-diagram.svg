<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background-color: transparent; font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 1 1 L 9 5 L 1 9 Z" fill="#6B7280"/>
        </marker>
    </defs>

    <!-- (A) OUTER dashed rounded rectangle -->
    <rect x="20" y="20" width="1060" height="640" rx="16" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="40" y="45" font-size="14" fill="#6B7280" font-weight="500">AX — 기존 조직 (AI Transformation)</text>

    <!-- (G) TOP CENTER — Production arrow & labels (moved to x=500 to avoid AX label overlap) -->
    <text x="500" y="55" font-size="12" fill="#6B7280" text-anchor="middle">Production = Agent × Reinsman</text>
    <text x="500" y="78" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Production ↑</text>
    <line x1="500" y1="170" x2="500" y2="100" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>

    <!-- (B) LEFT SIDE — Stylized Horse (AI Agent) -->
    <!-- Tail (Drawn behind body) -->
    <path d="M 145 340 C 120 340, 110 360, 115 385" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Legs (Drawn behind body) -->
    <rect x="165" y="370" width="8" height="80" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
    <rect x="195" y="370" width="8" height="70" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
    <rect x="255" y="370" width="8" height="80" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
    <rect x="285" y="370" width="8" height="70" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>

    <!-- Horse Body & Head -->
    <path d="M 160 390 C 120 380, 130 320, 180 320 L 260 320 C 280 300, 310 250, 330 240 C 345 230, 365 235, 375 250 L 390 270 C 395 280, 385 295, 370 295 L 330 310 C 320 340, 320 380, 280 390 Z" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Ears -->
    <path d="M 335 245 L 330 220 L 345 235 Z" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 348 245 L 350 225 L 358 238 Z" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Eye -->
    <circle cx="360" cy="258" r="2.5" fill="#111827"/>

    <!-- Horse Labels -->
    <text x="220" y="490" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">Agent</text>
    <text x="220" y="512" font-size="14" fill="#6B7280" text-anchor="middle">Model + Harness</text>
    <text x="220" y="530" font-size="11" fill="#9CA3AF" text-anchor="middle">— Hashimoto, 26.1Q</text>

    <!-- (C) HARNESS BAND + leader pointing to annotation placed below horse labels -->
    <path d="M 205 318 Q 230 318 245 325 L 240 393 Q 220 395 200 393 L 195 325 Q 200 318 205 318 Z" fill="#F97316" fill-opacity="0.22" stroke="#F97316" stroke-width="2" stroke-linejoin="round"/>
    <!-- Leader line from Harness band down to annotation block -->
    <path d="M 245 360 Q 300 360 330 470 L 335 548" fill="none" stroke="#F97316" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.7"/>
    <text x="340" y="560" font-size="12" fill="#9A3412" font-weight="600" text-anchor="start">Harness</text>
    <text x="340" y="577" font-size="10" fill="#9A3412" text-anchor="start">AGENTS.md · tools · rules</text>

    <!-- (D) REINS -->
    <path d="M 380 290 C 460 340, 560 340, 650 305" stroke="#DC2626" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- (E) REINSMAN FIGURE -->
    <!-- Right Arm (Back) -->
    <line x1="680" y1="265" x2="655" y2="300" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Body -->
    <path d="M 672 244 L 728 244 L 740 330 L 660 330 Z" fill="#2563EB" fill-opacity="0.18" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Left Arm (Front) -->
    <line x1="672" y1="270" x2="650" y2="305" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="700" cy="220" r="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    
    <!-- Reinsman Labels -->
    <text x="700" y="370" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Reinsman (마부)</text>
    <text x="700" y="395" font-size="13" fill="#4B5563" text-anchor="middle">— 고삐를 쥔 사람</text>

    <!-- (F) FOUR BADGES & CONNECTION -->
    <text x="945" y="80" font-size="13" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Reinsman의 4가지 일</text>

    <!-- Badge 1 -->
    <rect x="830" y="100" width="230" height="36" rx="8" fill="#2563EB" fill-opacity="0.08" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="945" y="123" font-size="14" font-weight="500" fill="#111827" text-anchor="middle">Ⅰ. 맥락 중간 결재</text>

    <!-- Badge 2 -->
    <rect x="830" y="160" width="230" height="36" rx="8" fill="#2563EB" fill-opacity="0.08" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="945" y="183" font-size="14" font-weight="500" fill="#111827" text-anchor="middle">Ⅱ. 전결권 조율</text>

    <!-- Badge 3 -->
    <rect x="830" y="220" width="230" height="36" rx="8" fill="#2563EB" fill-opacity="0.08" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="945" y="243" font-size="14" font-weight="500" fill="#111827" text-anchor="middle">Ⅲ. Y/N 승인 · 모니터링</text>

    <!-- Badge 4 -->
    <rect x="830" y="280" width="230" height="36" rx="8" fill="#2563EB" fill-opacity="0.08" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="945" y="303" font-size="14" font-weight="500" fill="#111827" text-anchor="middle">Ⅳ. 조직 관성 연착륙</text>

    <!-- Single Shared Bracket -->
    <path d="M 825 100 L 815 100 L 815 316 L 825 316" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Clean Continuous Line connecting Bracket to Reinsman -->
    <path d="M 815 208 C 790 208, 770 290, 740 290" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- (H) LEGEND -->
    <!-- Swatch 1: Model -->
    <rect x="380" y="620" width="14" height="14" rx="3" fill="#9CA3AF"/>
    <text x="402" y="632" font-size="12" fill="#4B5563">Model (LLM)</text>

    <!-- Swatch 2: Harness -->
    <rect x="520" y="620" width="14" height="14" rx="3" fill="#F97316"/>
    <text x="542" y="632" font-size="12" fill="#4B5563">Harness (엔지니어링)</text>

    <!-- Swatch 3: Reinsman -->
    <rect x="700" y="620" width="14" height="14" rx="3" fill="#2563EB"/>
    <text x="722" y="632" font-size="12" fill="#4B5563">Reinsman (리더십)</text>

</svg>